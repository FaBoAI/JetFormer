[pytest]
# data/ は実行時のデータ(git 管理外)。シミュレーター本体の写し data/sim/releases/ にはユーザーのテストも入っているので、
# テスト一式に集めない(集めると import の時点でユーザーのコードが動くため)。ほかは pytest の既定と同じ
# fixtures/ は試験が読む「直す前の写し」の置き場(写しの test_*.py を本物の試験として集めない。10/28 main session)
norecursedirs = data fixtures .* *.egg _darcs build CVS dist node_modules venv {arch}
